<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pustakaloka — Jelajahi Dunia Lewat Buku</title>
    <meta
      name="description"
      content="Perpustakaan publik untuk membaca, belajar, dan menemukan gagasan baru."
    />
    <link rel="canonical" href="https://example.com/index.html" />
    <meta property="og:title" content="Pustakaloka — Jelajahi Dunia Lewat Buku" />
    <meta
      property="og:description"
      content="Perpustakaan publik untuk membaca, belajar, dan menemukan gagasan baru."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      href="./assets/img/hero/library-interior-mobile-480.webp"
      imagesrcset="./assets/img/hero/library-interior-mobile-480.webp 480w, ./assets/img/hero/library-interior-mobile-800.webp 800w"
      imagesizes="100vw"
      media="(max-width: 767px)"
      fetchpriority="high"
      type="image/webp"
    />
    <link
      rel="preload"
      as="image"
      href="./assets/img/hero/library-interior-optimized.webp"
      imagesrcset="./assets/img/hero/library-interior-800.webp 800w, ./assets/img/hero/library-interior-optimized.webp 1280w"
      imagesizes="100vw"
      media="(min-width: 768px)"
      fetchpriority="high"
      type="image/webp"
    />
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body data-page="home" class="min-h-screen">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[70] focus:rounded focus:bg-white focus:px-4 focus:py-2"
      >Lewati ke konten utama</a
    >
    <div id="site-header" class="min-h-[108px]"></div>
    <main id="main" tabindex="-1">
      <section
        class="bg-charcoal-900 relative z-10 min-h-[520px] overflow-visible text-white lg:min-h-[620px]"
        data-static-hero
      >
        <picture class="absolute inset-0">
          <source
            media="(max-width: 767px)"
            srcset="
              ./assets/img/hero/library-interior-mobile-480.webp 480w,
              ./assets/img/hero/library-interior-mobile-800.webp 800w
            "
            sizes="100vw"
          />
          <img
            data-static-hero-image
            src="./assets/img/hero/library-interior-optimized.webp"
            srcset="
              ./assets/img/hero/library-interior-800.webp        800w,
              ./assets/img/hero/library-interior-optimized.webp 1280w
            "
            sizes="100vw"
            alt="Interior perpustakaan dengan rak buku"
            width="1280"
            height="751"
            fetchpriority="high"
            decoding="async"
            class="absolute inset-0 h-full w-full object-cover opacity-80"
          />
        </picture>
        <div
          class="absolute inset-0 bg-gradient-to-r from-black/75 via-black/40 to-transparent"
        ></div>
        <div
          class="container-page relative flex min-h-[520px] items-center pt-20 pb-20 lg:min-h-[620px]"
        >
          <div class="max-w-xl">
            <p class="text-brand-300 mb-4 text-sm font-semibold tracking-[0.22em] uppercase">
              Ruang tumbuh untuk rasa ingin tahu
            </p>
            <h1
              class="text-[clamp(2rem,5vw,3.5rem)] leading-[1.1] font-bold tracking-wide uppercase"
            >
              <span class="text-white">Jelajahi dunia</span><br /><span class="text-brand-300"
                >lewat buku.</span
              >
            </h1>
            <p class="mt-5 max-w-lg text-base leading-7 text-white/90">
              Temukan bacaan yang membuat Anda bertanya, memahami, dan melihat kemungkinan baru.
            </p>
            <div class="mt-8 flex flex-wrap gap-3">
              <a class="btn-light" href="./src/pages/tentang.html">Tentang kami</a>
              <a class="btn-primary" href="./src/pages/kontak.html">Hubungi kami</a>
            </div>
          </div>
        </div>
        <div class="container-page absolute inset-x-0 bottom-0 z-20 translate-y-1/2">
          <form
            class="bg-charcoal-600/95 shadow-card-hover grid gap-3 p-4 md:grid-cols-[1fr_220px_auto] md:p-5"
            data-home-search
          >
            <div>
              <label class="sr-only" for="home-query">Kata kunci</label>
              <input
                class="field bg-charcoal-700 text-white placeholder:text-white/70"
                id="home-query"
                name="q"
                placeholder="Cari judul, penulis, atau ISBN"
              />
            </div>
            <div>
              <label class="sr-only" for="home-category">Kategori</label>
              <select class="field bg-charcoal-700 text-white" id="home-category" name="kategori">
                <option value="">Semua kategori</option>
              </select>
            </div>
            <button class="btn-primary" type="submit">Cari</button>
          </form>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <noscript
      ><p class="p-4 text-center">
        Aktifkan JavaScript untuk pengalaman penuh.
        <a href="./src/pages/katalog.html">Buka katalog</a> ·
        <a href="./src/pages/kontak.html">Kontak</a>
      </p></noscript
    >
    <script type="module" src="./src/js/pages/home.js"></script>
  </body>
</html>
